name: Warm production

# Vercel deploys main on every push (~1 min). Each deployment starts with a cold Python function
# (~3 s) and an empty CDN cache, so wait for the new deployment to answer, then wake the API before
# real visitors arrive. The CDN fill only covers the edge region nearest the runner (caches are regional).
# (Triggered on push because this Vercel project doesn't emit GitHub deployment_status events.)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://wind-forecast-monitor-eosin.vercel.app
    steps:
      - name: Wait for an API instance started after this push
        run: |
          since=$(date -u +%s)
          for i in $(seq 1 40); do
            loaded=$(curl -fsS "$SITE/api/health" | python3 -c "import json, sys, datetime; t = json.load(sys.stdin)['loaded_at']; print(int(datetime.datetime.fromisoformat(t.replace('Z', '+00:00')).timestamp()))" || echo 0)
            if [ "$loaded" -ge "$since" ]; then echo "Fresh API instance (loaded_at $loaded)"; exit 0; fi
            sleep 15
          done
          echo "No fresh instance seen within 10 minutes; warming anyway."

      - name: Fill the CDN cache for the default view
        run: |
          Q="start=2026-01-02&end=2026-02-01"
          for path in "/" "/api/actuals?$Q" "/api/metrics?$Q&mode=cutoff&cutoff_hour=9&cutoff_minute=50" "/api/error-by-horizon?$Q"; do
            # Responses vary by encoding; warm the variants browsers send.
            for enc in "gzip, deflate, br, zstd" "gzip, deflate, br" "gzip, deflate"; do
              curl -fsS -o /dev/null -H "Accept-Encoding: $enc" -w "%{http_code} %{time_total}s $path ($enc)\n" "$SITE$path"
            done
          done

      - name: Second pass (in case the first poll reached the previous deployment)
        run: |
          sleep 120
          curl -fsS "$SITE/api/health"; echo
          Q="start=2026-01-02&end=2026-02-01"
          for path in "/api/actuals?$Q" "/api/metrics?$Q&mode=cutoff&cutoff_hour=9&cutoff_minute=50" "/api/error-by-horizon?$Q"; do
            for enc in "gzip, deflate, br, zstd" "gzip, deflate, br" "gzip, deflate"; do
              curl -fsS -o /dev/null -H "Accept-Encoding: $enc" -w "%{http_code} %{time_total}s $path ($enc)\n" "$SITE$path"
            done
          done
