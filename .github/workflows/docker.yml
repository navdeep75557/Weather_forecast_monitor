name: Docker

# Builds both images, starts docker-compose, smoke-tests the nginx /api proxy and CORS,
# then runs the Playwright e2e suite against the containerised stack.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack (waits for the backend healthcheck)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "Wind Forecast Monitor"
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS "http://localhost:8080/api/metrics?include_points=false" \
            | python3 -c "import json,sys; m=json.load(sys.stdin)['overall']; assert m['n'] == 744, m; print('n', m['n'], 'MAE', m['mae'])"
          # Direct API call from an allowed origin gets a CORS header
          curl -fsS -o /dev/null -D - -H "Origin: http://localhost:8080" http://localhost:8000/api/health \
            | grep -i "access-control-allow-origin: http://localhost:8080"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright e2e against the Docker stack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
