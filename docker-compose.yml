services:
  backend:
    build: ./backend
    environment:
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      REFRESH_ON_STARTUP: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""  # same-origin; nginx proxies /api to the backend service
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
