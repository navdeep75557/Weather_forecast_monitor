<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Day-ahead wind forecast accuracy for GB power buying: the forecast available at decision time vs actual wind output (Elexon BMRS, January 2026)." />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wind Forecast Monitor</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        if (localStorage.getItem("wfm-theme") === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static shell (same markup as TopBar) so the first paint doesn't wait for JavaScript; React replaces it. -->
      <header class="border-b border-border bg-surface">
        <div class="mx-auto flex h-14 max-w-[1440px] items-center gap-2 px-4 sm:gap-3 md:px-6">
          <div class="hidden size-8 shrink-0 rounded-lg bg-accent sm:block"></div>
          <span class="truncate text-base font-semibold tracking-tight">Wind Forecast Monitor</span>
          <span class="shrink-0 rounded-full border border-border bg-surface-2 px-2 py-0.5 text-xs font-medium whitespace-nowrap text-fg-2">Jan 2026 decisions</span>
        </div>
      </header>
      <noscript><p class="mx-auto max-w-[1440px] px-4 py-6 text-sm md:px-6">This dashboard needs JavaScript enabled.</p></noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
